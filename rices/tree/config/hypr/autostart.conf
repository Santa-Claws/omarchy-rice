# Workspace autostart
exec-once = hyprctl setcursor default 6
exec-once = systemctl --user set-environment XCURSOR_THEME=default XCURSOR_SIZE=6 HYPRCURSOR_SIZE=6
exec-once = [workspace 1 silent] uwsm-app -- firefox
exec-once = [workspace 2 silent] uwsm-app -- xdg-terminal-exec
exec-once = [workspace 2 silent] uwsm-app -- xdg-terminal-exec
exec-once = [workspace 3 silent] flatpak run com.discordapp.Discord --force-device-scale-factor=0.7
exec-once = [workspace 4 silent] uwsm-app -- env XCURSOR_SIZE=6 HYPRCURSOR_SIZE=6 spotify --force-device-scale-factor=0.7
